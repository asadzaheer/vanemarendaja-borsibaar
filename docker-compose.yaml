services:
  postgres:
    # Note: Pinned to PostgreSQL 16 to maintain compatibility with existing database volume.
    # The postgres_data volume was initialized with PostgreSQL 16. Upgrading to 17+ requires
    # either: (1) deleting the volume (loses data), or (2) running a pg_dump/pg_restore migration.
    # To upgrade: delete postgres_data volume and rebuild with PostgreSQL 17+
    image: postgres:16
    container_name: borsibaar-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: backend
      dockerfile: Dockerfile.dev
    container_name: borsibaar-backend
    command: ./mvnw spring-boot:run
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    depends_on:
      - postgres

volumes:
  postgres_data:
